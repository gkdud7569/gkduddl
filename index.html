
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>하영이 간호사 키우기</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;background:#202b36;color:white;
 font-family:Arial,sans-serif;
 display:flex;justify-content:center;
 min-height:100dvh;overflow:hidden;
 touch-action:none;
}
.app{width:100%;max-width:700px;padding:12px;text-align:center}
h1{font-size:23px;color:#a7f3d0;margin:8px}
.sub{font-size:12px;color:#cbd5e1;margin-bottom:10px}
.status{
 display:flex;justify-content:space-around;gap:5px;
 background:#334155;border-radius:12px;padding:10px;
 margin-bottom:9px;font-size:13px
}
.status b{color:#a7f3d0;font-size:17px}
canvas{
 width:100%;height:auto;display:block;
 border:4px solid #64748b;border-radius:9px;
 background:#d8e8dc;image-rendering:pixelated;
 touch-action:none;
}
.mission{
 background:#334155;border:1px solid #64748b;
 padding:10px;border-radius:10px;margin-top:9px;
 font-size:14px;line-height:1.6;min-height:65px
}
.mission strong{color:#fde68a}
.controls{
 display:flex;justify-content:space-between;
 align-items:center;margin-top:10px;gap:12px
}
.pad{display:grid;grid-template-columns:repeat(3,48px);gap:4px}
button{
 border:0;border-radius:10px;background:#475569;
 color:white;font-size:19px;font-weight:bold;
 padding:11px;touch-action:none;
 box-shadow:0 3px #263449;
}
button:active{background:#0d9488;transform:translateY(2px);box-shadow:none}
.pad button{height:43px;padding:5px}
.blank{visibility:hidden}
.action{background:#0d9488;flex:1;max-width:140px;font-size:15px}
.music{background:#475569;font-size:14px}
#start{background:#16a085;font-size:15px}
.note{font-size:11px;color:#cbd5e1;margin:12px}
.overlay{
 position:fixed;inset:0;background:#101827dd;
 display:flex;align-items:center;justify-content:center;
 padding:20px;z-index:5
}
.dialog{
 width:100%;max-width:340px;background:#334155;
 padding:25px;border:2px solid #6ee7b7;
 border-radius:18px;text-align:center
}
.dialog h2{color:#a7f3d0}
.dialog p{font-size:14px;line-height:1.8;color:#e2e8f0}
.hidden{display:none}
</style>
</head>
<body>
<div class="app">
<h1>🌷 하영이 간호사 키우기 🏥</h1>
<div class="sub">오늘도 병동을 지켜주세요! 간호사 하영이의 하루</div>

<div class="status">
 <div>⭐ 점수<br><b id="score">0</b></div>
 <div>💗 체력<br><b id="hp">100</b></div>
 <div>🌟 레벨<br><b id="level">1</b></div>
 <div>⏰ 남은 시간<br><b id="time">90</b></div>
</div>

<canvas id="game" width="640" height="480"></canvas>

<div class="mission" id="mission">
 🌸 하영이에게 병동을 소개해 주세요!<br>
 <strong>게임 시작을 눌러주세요.</strong>
</div>

<div class="controls">
 <div class="pad">
  <button class="blank"> </button>
  <button data-dir="up">▲</button>
  <button class="blank"> </button>
  <button data-dir="left">◀</button>
  <button data-dir="down">▼</button>
  <button data-dir="right">▶</button>
 </div>
 <button class="action" id="interact">💉 간호하기</button>
 <button class="music" id="music">🎵 ON</button>
</div>
<button id="start" style="width:100%;margin-top:13px">▶ 게임 시작하기</button>
<div class="note">키보드 방향키 / WASD 이동 · E 또는 간호하기 버튼으로 미션 수행</div>
</div>

<div class="overlay" id="overlay">
 <div class="dialog">
  <h2 id="title">🌷 하영이 간호사 키우기</h2>
  <p id="description">
   귀여운 병동에서 간호사 하영이의 하루가 시작돼요!<br><br>
   환자에게 다가가 간호 미션을 수행하세요.<br>
   90초 동안 최대한 많은 환자를 돌봐주세요!<br><br>
   🎵 신나는 음악과 함께 출발!
  </p>
  <button id="begin" style="background:#0d9488;width:100%">병동 출근하기 🏥</button>
 </div>
</div>

<script>
const c=document.getElementById("game");
const ctx=c.getContext("2d");
const $=id=>document.getElementById(id);

let active=false,score=0,hp=100,level=1,time=90;
let last=0,raf=null,timer=null;
let musicOn=true,audio=null,musicTimer=null,musicIndex=0;

const nurse={x:310,y:340,speed:3.2,dir:"up"};
const keys={};
const tile=40;

const patients=[
 {x:130,y:125,name:"김순자 환자",task:"체온 측정",icon:"🌡️",done:false,color:"#f6c6b5"},
 {x:320,y:125,name:"박철수 환자",task:"혈압 측정",icon:"🩺",done:false,color:"#b9d9fa"},
 {x:510,y:125,name:"이영희 환자",task:"약 전달",icon:"💊",done:false,color:"#f3d4a7"},
 {x:130,y:280,name:"최민수 환자",task:"수액 확인",icon:"💧",done:false,color:"#d8c7f7"},
 {x:510,y:280,name:"정미자 환자",task:"환자 안위 확인",icon:"💗",done:false,color:"#f4c9dc"}
];

const melody=[
 523,659,784,659,523,659,880,784,
 587,698,880,698,587,698,988,880,
 659,784,1046,784,659,784,988,880
];

function sound(freq,duration=.13,volume=.035){
 if(!audio||!musicOn)return;
 const o=audio.createOscillator();
 const g=audio.createGain();
 o.type="square";o.frequency.value=freq;
 g.gain.setValueAtTime(volume,audio.currentTime);
 g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+duration);
 o.connect(g);g.connect(audio.destination);
 o.start();o.stop(audio.currentTime+duration);
}
function startMusic(){
 if(!musicOn||musicTimer)return;
 musicTimer=setInterval(()=>{
  if(!active)return;
  sound(melody[musicIndex],.18,.022);
  musicIndex=(musicIndex+1)%melody.length;
 },180);
}
function stopMusic(){
 clearInterval(musicTimer);musicTimer=null;
}
function initAudio(){
 if(!audio){
  const AC=window.AudioContext||window.webkitAudioContext;
  if(AC)audio=new AC();
 }
 if(audio&&audio.state==="suspended")audio.resume();
}

function rect(x,y,w,h,color){
 ctx.fillStyle=color;ctx.fillRect(x,y,w,h);
}
function text(str,x,y,size=13,color="#334155"){
 ctx.font="bold "+size+"px Arial";
 ctx.textAlign="center";ctx.fillStyle=color;
 ctx.fillText(str,x,y);
}
function drawRoom(){
 rect(0,0,640,480,"#dcebdc");

 // 바닥 타일
 for(let y=0;y<480;y+=40){
  for(let x=0;x<640;x+=40){
   rect(x,y,39,39,(x/40+y/40)%2===0?"#e5efdf":"#d8e7d6");
  }
 }
 // 벽
 rect(0,0,640,45,"#d5bba4");
 rect(0,42,640,8,"#a98c76");
 text("🌼  HAPPY HOSPITAL  🌼",320,30,19,"#685447");

 // 창문
 for(let x of [45,255,465]){
  rect(x,58,115,8,"#a6c9b6");
  rect(x,65,115,55,"#bde6ed");
  rect(x+54,65,5,55,"#ffffff");
  rect(x,90,115,4,"#ffffff");
 }

 // 병상
 patients.forEach(p=>{
  rect(p.x-48,p.y-20,96,65,"#8babc2");
  rect(p.x-43,p.y-15,86,54,"#fafafa");
  rect(p.x-40,p.y-12,30,27,p.color);
  rect(p.x-10,p.y-12,55,27,"#ffffff");
  rect(p.x-47,p.y+40,5,10,"#64748b");
  rect(p.x+42,p.y+40,5,10,"#64748b");
  rect(p.x-48,p.y-25,96,5,"#8babc2");
  text(p.name,p.x,p.y-35,12);
  if(p.done){
   text("✔ 완료",p.x,p.y+70,15,"#16875d");
  }else{
   text(p.icon,p.x+47,p.y-10,19);
   text("미션!",p.x,p.y+70,12,"#b45309");
  }
 });

 // 간호사 스테이션
 rect(225,395,190,45,"#b58c6b");
 rect(235,385,170,15,"#e7c5a0");
 text("👩‍⚕️ NURSE STATION",320,423,14,"#ffffff");

 // 화분
 text("🪴",25,380,28);
 text("🪴",615,380,28);
 text("🧸",40,210,24);
 text("🧴",600,205,24);
}

function drawNurse(){
 const x=nurse.x,y=nurse.y;

 // 그림자
 rect(x-12,y+18,26,6,"#a9b9a5");

 // 다리
 rect(x-9,y+8,7,13,"#405b77");
 rect(x+3,y+8,7,13,"#405b77");

 // 몸
 rect(x-13,y-13,27,24,"#ffffff");
 rect(x-8,y-11,16,18,"#65b9c0");
 rect(x-2,y-9,5,11,"#ffffff");

 // 머리
 rect(x-11,y-32,23,20,"#f2c5a4");
 rect(x-13,y-37,26,10,"#654c39");
 rect(x-11,y-27,4,5,"#654c39");
 rect(x+7,y-27,4,5,"#654c39");

 // 눈
 rect(x-6,y-25,3,3,"#333333");
 rect(x+4,y-25,3,3,"#333333");

 // 간호사 모자
 rect(x-10,y-40,20,6,"#ffffff");
 rect(x-2,y-39,4,4,"#ef7777");

 text("하영",x,y+33,11,"#334155");
}

function draw(){
 drawRoom();
 drawNurse();

 // 가까운 환자 강조
 const p=nearest();
 if(p&&!p.done){
  ctx.strokeStyle="#f59e0b";
  ctx.lineWidth=3;
  ctx.strokeRect(p.x-53,p.y-28,106,82);
 }
}

function nearest(){
 let best=null,dist=Infinity;
 patients.forEach(p=>{
  const d=Math.hypot(p.x-nurse.x,p.y-nurse.y);
  if(d<65&&d<dist&&!p.done){best=p;dist=d;}
 });
 return best;
}

function updateMission(){
 const done=patients.filter(p=>p.done).length;
 const p=nearest();
 if(done===patients.length){
  $("mission").innerHTML="🎉 <strong>모든 환자를 돌봤어요! 대단해요 하영 간호사!</strong>";
 }else if(p){
  $("mission").innerHTML="👩‍⚕️ <strong>"+p.name+"</strong><br>"+p.icon+" "+p.task+" — 간호하기 버튼을 누르세요!";
 }else{
  $("mission").innerHTML="📋 <strong>간호 미션</strong><br>가까운 환자에게 다가가 간호하기 버튼을 눌러주세요!";
 }
}

function interact(){
 if(!active)return;
 const p=nearest();
 if(!p){
  $("mission").innerHTML="🔍 <strong>환자 가까이 이동해 주세요!</strong>";
  return;
 }
 p.done=true;
 score+=100;
 hp=Math.min(100,hp+5);
 level=Math.floor(score/300)+1;
 $("score").textContent=score;
 $("hp").textContent=hp;
 $("level").textContent=level;

 sound(880,.2,.05);
 setTimeout(()=>sound(1175,.2,.04),100);
 updateMission();
 draw();

 if(patients.every(p=>p.done))finish(true);
}

function move(){
 if(!active)return;
 let dx=0,dy=0;
 if(keys.left||keys.ArrowLeft||keys.a)dx=-1;
 if(keys.right||keys.ArrowRight||keys.d)dx=1;
 if(keys.up||keys.ArrowUp||keys.w)dy=-1;
 if(keys.down||keys.ArrowDown||keys.s)dy=1;

 if(dx&&dy){dx*=.707;dy*=.707}
 nurse.x=Math.max(25,Math.min(615,nurse.x+dx*nurse.speed));
 nurse.y=Math.max(145,Math.min(370,nurse.y+dy*nurse.speed));
 if(dx||dy)updateMission();
}

function loop(now){
 if(!active)return;
 const dt=Math.min((now-last)/16.67,2);
 last=now;
 const old=nurse.speed;
 nurse.speed=3.2*dt;
 move();
 nurse.speed=old;
 draw();
 raf=requestAnimationFrame(loop);
}

function finish(all=false){
 if(!active)return;
 active=false;
 cancelAnimationFrame(raf);
 stopMusic();
 clearInterval(timer);
 $("title").textContent=all?"🏆 오늘의 간호 미션 완료!":"🌙 근무 종료!";
 $("description").innerHTML=
 "오늘의 점수: <b style='color:#a7f3d0'>"+score+"점</b><br>"+
 "달성 레벨: "+level+"<br><br>"+
 (all?"모든 환자를 돌봤어요! 훌륭한 간호사예요!":"수고했어요! 다음 근무도 파이팅!");
 $("begin").textContent="다시 출근하기";
 $("overlay").classList.remove("hidden");
}

function start(){
 initAudio();
 stopMusic();
 clearInterval(timer);
 cancelAnimationFrame(raf);

 patients.forEach(p=>p.done=false);
 nurse.x=310;nurse.y=340;
 score=0;hp=100;level=1;time=90;
 $("score").textContent=0;
 $("hp").textContent=100;
 $("level").textContent=1;
 $("time").textContent=90;

 active=true;
 last=performance.now();
 $("overlay").classList.add("hidden");
 updateMission();
 draw();
 startMusic();
 raf=requestAnimationFrame(loop);

 timer=setInterval(()=>{
  if(!active)return;
  time--;
  $("time").textContent=time;
  if(time<=0)finish();
 },1000);
}

$("begin").onclick=start;
$("start").onclick=start;
$("interact").onclick=interact;
$("music").onclick=()=>{
 musicOn=!musicOn;
 $("music").textContent=musicOn?"🎵 ON":"🔇 OFF";
 if(musicOn){initAudio();startMusic()}
 else stopMusic();
};

document.addEventListener("keydown",e=>{
 const map={
  ArrowLeft:"left",ArrowRight:"right",
  ArrowUp:"up",ArrowDown:"down",
  a:"left",d:"right",w:"up",s:"down"
 };
 if(map[e.key]){
  e.preventDefault();keys[map[e.key]]=true;
 }
 if(e.key==="e"||e.key==="Enter")interact();
});
document.addEventListener("keyup",e=>{
 const map={
  ArrowLeft:"left",ArrowRight:"right",
  ArrowUp:"up",ArrowDown:"down",
  a:"left",d:"right",w:"up",s:"down"
 };
 if(map[e.key])keys[map[e.key]]=false;
});

document.querySelectorAll("[data-dir]").forEach(btn=>{
 const dir=btn.dataset.dir;
 btn.addEventListener("pointerdown",e=>{
  e.preventDefault();keys[dir]=true;
 });
 ["pointerup","pointercancel","pointerleave"].forEach(ev=>{
  btn.addEventListener(ev,()=>keys[dir]=false);
 });
});

draw();
</script>
</body>
</html>
