<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f8f5ef">
  <title>햄찌의 책갈피</title>
  <style>
    :root {
      color-scheme: light;
      --paper: #89869f;
      --white: #fffdf7;
      --ink: #302d40;
      --muted: #8c8997;
      --line: #e6e1d8;
      --orange: #eab83b;
      --orange-dark: #927126;
      --green: #59ad78;
      --shadow: 0 18px 48px rgba(36, 31, 59, .2);
      font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    }

    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; background: linear-gradient(145deg, #918da7 0%, #77758f 100%); color: #fbf9ff; }
    button, input, select { font: inherit; }
    button { cursor: pointer; }
    .app-shell { width: min(1120px, calc(100% - 48px)); margin: 0 auto; padding: 26px 0 64px; }
    .topbar { display: flex; align-items: center; justify-content: space-between; gap: 20px; padding: 12px 16px; border: 1px solid rgba(255,255,255,.2); border-radius: 22px; background: rgba(255,255,255,.1); backdrop-filter: blur(12px); }
    .brand { display: flex; align-items: center; gap: 11px; }
    .brand-mark { display: grid; width: 43px; height: 43px; place-items: center; border: 1px solid rgba(255,255,255,.24); border-radius: 50%; background: rgba(255,255,255,.16); color: white; font-size: 15px; font-weight: 800; }
    .brand-name { color: #fff; font-size: 17px; font-weight: 800; letter-spacing: -.5px; }
    .brand-caption { margin-top: 3px; color: rgba(255,255,255,.72); font-size: 11px; }
    .top-actions { display: flex; align-items: center; gap: 12px; }
    .date-label { color: rgba(255,255,255,.82); font-size: 13px; }
    .primary-button { display: inline-flex; min-height: 44px; align-items: center; justify-content: center; gap: 8px; padding: 0 18px; border: 0; border-radius: 999px; background: #f0c84f; color: #393244; font-weight: 800; box-shadow: 0 6px 16px rgba(44,37,67,.16); transition: transform .18s, background .18s; }
    .primary-button:hover { transform: translateY(-2px); background: #f6d66f; }

    .hero { position: relative; display: flex; min-height: 350px; align-items: center; justify-content: flex-start; margin: 34px 0 38px; padding: 42px; overflow: hidden; border: 0; border-radius: 30px; background: linear-gradient(135deg, #fbf8ef 0%, #eae5d8 100%); color: var(--ink); box-shadow: var(--shadow); text-align: left; }
    .hero-copy { position: relative; z-index: 1; width: min(58%, 560px); margin: 0; padding: 0; border: 0; border-radius: 0; background: transparent; box-shadow: none; }
    .eyebrow { margin: 0 0 12px; color: #9c7d39; font-size: 12px; font-weight: 800; letter-spacing: 1.4px; text-transform: uppercase; }
    h1 { margin: 0; font-size: clamp(27px, 4vw, 39px); letter-spacing: -1.8px; line-height: 1.25; }
    .hero-copy > p:last-child { margin: 12px 0 0; color: #777183; font-size: 14px; line-height: 1.7; }
    .hero-mascot { position: absolute; z-index: 0; top: 50%; right: 4%; left: auto; width: 340px; height: 300px; border-radius: 24px; object-fit: cover; transform: translateY(-50%); mix-blend-mode: multiply; opacity: .94; box-shadow: 0 18px 34px rgba(47,39,67,.16); }

    .section-heading { display: flex; align-items: end; justify-content: space-between; gap: 18px; margin-bottom: 17px; }
    .section-heading h2 { margin: 0; color: #fff; font-size: 23px; letter-spacing: -.7px; }
    .section-heading p { margin: 6px 0 0; color: rgba(255,255,255,.7); font-size: 12px; }
    .toolbar { display: flex; align-items: center; gap: 10px; }
    .search-wrap { position: relative; }
    .search-icon { position: absolute; top: 50%; left: 13px; color: #8b8798; transform: translateY(-50%); pointer-events: none; }
    .search-input { width: 200px; height: 42px; padding: 0 14px 0 36px; border: 1px solid rgba(255,255,255,.55); border-radius: 999px; outline: 0; background: rgba(255,255,255,.94); font-size: 13px; }
    .search-input:focus, .field input:focus, .field select:focus { border-color: #d78a64; box-shadow: 0 0 0 3px rgba(233, 131, 80, .12); }
    .filter-select { height: 42px; padding: 0 30px 0 14px; border: 1px solid rgba(255,255,255,.55); border-radius: 999px; outline: 0; background: rgba(255,255,255,.94); color: #514c44; font-size: 13px; }
    .book-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
    .book-card { position: relative; min-width: 0; overflow: hidden; padding: 20px; border: 1px solid rgba(255,255,255,.5); border-radius: 20px; background: linear-gradient(150deg, #fffdf8 0%, #f2efe6 100%); color: var(--ink); box-shadow: 0 12px 28px rgba(36,31,59,.16); transition: transform .2s, box-shadow .2s; }
    .book-card::before { position: absolute; top: 16px; bottom: 16px; left: 0; width: 6px; border-radius: 0 6px 6px 0; background: #65b77f; content: ""; }
    .book-card[data-status="finished"]::before { background: #e8ba48; }
    .book-card[data-status="want"]::before { background: #78a7d7; }
    .book-card:hover { transform: translateY(-3px); box-shadow: 0 18px 36px rgba(36,31,59,.22); }
    .book-card-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 15px; }
    .book-status-group { display: flex; min-width: 0; align-items: center; gap: 8px; }
    .status-label { display: inline-flex; align-items: center; min-height: 31px; padding: 0 5px; border-radius: 999px; background: #f3f0e9; color: #635d52; font-size: 13px; font-weight: 700; white-space: nowrap; }
    .status-label[data-status="reading"] { background: #edf2e9; color: #52694d; }
    .status-label[data-status="finished"] { background: #e9f0e9; color: #4e6752; }
    .status-label[data-status="want"] { width: 52px; min-height: 40px; justify-content: center; padding: 3px 5px; text-align: center; white-space: normal; line-height: 1.1; }
    .status-thumb { display: block; width: 126px; height: 87px; flex: 0 0 auto; border: 1px solid rgba(77, 62, 45, .12); border-radius: 12px; object-fit: cover; object-position: center 42%; box-shadow: 0 6px 14px rgba(45,39,61,.16); }
    .book-title { margin: 0; font-size: 17px; font-weight: 800; letter-spacing: -.4px; line-height: 1.45; overflow-wrap: anywhere; }
    .book-author { margin: 5px 0 0; color: var(--muted); font-size: 13px; }
    .progress-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 19px 0 9px; color: #777168; font-size: 12px; }
    .progress-number { color: var(--ink); font-weight: 700; }
    .progress-track { height: 6px; overflow: hidden; border-radius: 99px; background: #e8e4dc; }
    .progress-fill { height: 100%; border-radius: inherit; background: var(--orange); transition: width .25s; }
    .card-actions { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: 14px; }
    .progress-button { padding: 8px 10px; border: 0; border-radius: 9px; background: #f6f0e8; color: #6a5641; font-size: 11px; font-weight: 700; }
    .progress-button:hover { background: #eee2d1; }
    .delete-button { padding: 7px; border: 0; background: transparent; color: #aaa39a; font-size: 11px; white-space: nowrap; }
    .delete-button:hover { color: #b94f3e; }
    .empty-state { grid-column: 1 / -1; padding: 48px 20px; border: 1px dashed rgba(255,255,255,.55); border-radius: 20px; background: rgba(255,255,255,.92); color: var(--muted); text-align: center; }
    .empty-state strong { display: block; margin-bottom: 7px; color: #514c44; font-size: 15px; }
    .empty-state p { margin: 0; font-size: 13px; line-height: 1.6; }

    dialog { width: min(440px, calc(100% - 32px)); padding: 0; border: 0; border-radius: 20px; background: var(--white); color: var(--ink); box-shadow: 0 24px 80px rgba(31, 25, 18, .24); }
    dialog::backdrop { background: rgba(41, 37, 31, .36); backdrop-filter: blur(3px); }
    .dialog-content { padding: 25px; }
    .dialog-heading { display: flex; align-items: start; justify-content: space-between; margin-bottom: 21px; }
    .dialog-heading h2 { margin: 0; font-size: 21px; letter-spacing: -.7px; }
    .dialog-heading p { margin: 6px 0 0; color: var(--muted); font-size: 12px; }
    .close-button { width: 32px; height: 32px; border: 0; border-radius: 10px; background: #f4f1eb; color: #615b52; font-size: 18px; }
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px 12px; }
    .field { display: flex; flex-direction: column; gap: 7px; }
    .field.full { grid-column: 1 / -1; }
    .field label { color: #5e584f; font-size: 12px; font-weight: 700; }
    .field input, .field select { width: 100%; height: 42px; padding: 0 11px; border: 1px solid var(--line); border-radius: 10px; outline: 0; background: white; color: var(--ink); font-size: 13px; }
    .form-error { min-height: 18px; margin: 12px 0 0; color: #b94f3e; font-size: 12px; }
    .form-actions { display: flex; justify-content: end; gap: 9px; margin-top: 7px; }
    .secondary-button { min-height: 42px; padding: 0 16px; border: 1px solid var(--line); border-radius: 999px; background: white; color: #5e584f; font-weight: 700; }
    .form-actions .primary-button { min-height: 42px; border-radius: 11px; }
    .toast { position: fixed; right: 24px; bottom: 24px; z-index: 5; padding: 12px 17px; border-radius: 12px; background: var(--ink); color: white; font-size: 13px; box-shadow: var(--shadow); animation: appear .2s ease-out; }
    @keyframes appear { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    @media (max-width: 780px) {
      .app-shell { width: min(100% - 32px, 640px); padding-top: 22px; }
      .hero { min-height: 320px; margin-top: 30px; padding: 32px; }
      .hero-copy { width: 58%; }
      .hero-mascot { right: 2%; width: 285px; height: 260px; }
      .book-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .section-heading { align-items: start; flex-direction: column; }
      .toolbar { width: 100%; }
      .search-wrap { flex: 1; }
      .search-input { width: 100%; }
    }
    @media (max-width: 520px) {
      .app-shell { width: calc(100% - 28px); padding-top: 17px; }
      .date-label { display: none; }
      .topbar { gap: 8px; padding: 10px 12px; border-radius: 18px; }
      .brand-mark { width: 38px; height: 38px; }
      .brand-name { font-size: 15px; }
      .brand-caption { font-size: 10px; }
      .primary-button { min-height: 40px; padding: 0 13px; font-size: 13px; }
      .hero { min-height: 410px; align-items: flex-start; margin: 24px 0 28px; padding: 24px 18px; border-radius: 24px; text-align: center; }
      .hero-copy { width: 100%; }
      .hero-mascot { top: auto; right: 50%; bottom: 10px; width: 240px; height: 210px; transform: translateX(50%); }
      h1 { font-size: 27px; }
      .hero-copy > p:last-child { max-width: 250px; margin-right: auto; margin-left: auto; font-size: 12px; }
      .book-grid { grid-template-columns: 1fr; gap: 11px; }
      .book-card { padding: 17px; border-radius: 14px; }
      .book-title { font-size: 16px; }
      .progress-row { margin-top: 16px; }
      .progress-button { padding: 9px 11px; font-size: 11px; }
      .filter-select { max-width: 125px; }
      .toast { right: 14px; bottom: 14px; left: 14px; text-align: center; }
    }
  </style>
</head>
<body>
  <main class="app-shell">
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">책</div>
        <div>
          <div class="brand-name">햄찌의 책갈피</div>
          <div class="brand-caption">작은 햄스터의 커다란 독서생활</div>
        </div>
      </div>
      <div class="top-actions">
        <span class="date-label" id="todayLabel"></span>
        <button class="primary-button" id="openDialogButton" type="button"><span aria-hidden="true">＋</span> 새 기록</button>
      </div>
    </header>

    <section class="hero" aria-labelledby="welcomeTitle">
      <div class="hero-copy">
        <p class="eyebrow">MY LITTLE BOOK NOOK</p>
        <h1 id="welcomeTitle">오늘은 어떤 책을<br>읽어볼까요?</h1>
        <p>햄찌와 마음의 양식을 쌓자 아자아자 아자쓰!!</p>
      </div>
      <img class="hero-mascot" src="hamster-background.png" alt="햄스터 사진">
    </section>

    <section aria-labelledby="booksHeading">
      <div class="section-heading">
        <div>
          <h2 id="booksHeading">독서 기록</h2>
          <p>읽고 싶은 책도, 다 읽은 책도 여기에 모아요.</p>
        </div>
        <div class="toolbar">
          <label class="search-wrap">
            <span class="search-icon" aria-hidden="true">⌕</span>
            <input class="search-input" id="searchInput" type="search" placeholder="책 제목이나 작가 검색" aria-label="책 제목이나 작가 검색">
          </label>
          <select class="filter-select" id="statusFilter" aria-label="독서 상태 필터">
            <option value="all">전체 보기</option>
            <option value="reading">읽는 중</option>
            <option value="finished">완독</option>
            <option value="want">읽고 싶어요</option>
          </select>
        </div>
      </div>
      <div class="book-grid" id="bookGrid" aria-live="polite"></div>
    </section>
  </main>

  <dialog id="bookDialog" aria-labelledby="dialogTitle">
    <form class="dialog-content" id="bookForm">
      <div class="dialog-heading">
        <div>
          <h2 id="dialogTitle">새 책 기록하기</h2>
          <p>책 한 권을 책장에 살며시 올려둘까요?</p>
        </div>
        <button class="close-button" id="closeDialogButton" type="button" aria-label="닫기">×</button>
      </div>
      <div class="form-grid">
        <div class="field full">
          <label for="titleInput">책 제목</label>
          <input id="titleInput" name="title" maxlength="80" placeholder="예: 달러구트 꿈 백화점" required>
        </div>
        <div class="field full">
          <label for="authorInput">작가</label>
          <input id="authorInput" name="author" maxlength="60" placeholder="작가 이름" required>
        </div>
        <div class="field">
          <label for="pageInput">전체 쪽수</label>
          <input id="pageInput" name="pages" type="number" min="1" max="100000" placeholder="320" required>
        </div>
        <div class="field">
          <label for="readInput">읽은 쪽수</label>
          <input id="readInput" name="readPages" type="number" min="0" placeholder="0" value="0" required>
        </div>
        <div class="field full">
          <label for="statusInput">독서 상태</label>
          <select id="statusInput" name="status">
            <option value="reading">읽는 중</option>
            <option value="want">읽고 싶어요</option>
            <option value="finished">완독</option>
          </select>
        </div>
      </div>
      <p class="form-error" id="formError" role="alert"></p>
      <div class="form-actions">
        <button class="secondary-button" id="cancelButton" type="button">취소</button>
        <button class="primary-button" type="submit">책장에 담기</button>
      </div>
    </form>
  </dialog>

  <script>
    const STORAGE_KEY = "hamzzi-reading-journal-v1";
    const statusLabels = { reading: "읽는 중", finished: "완독", want: "읽고 싶어요" };
    const statusImages = { reading: "hamster-status.png", finished: "hamster-status.png", want: "hamster-status.png" };
    const bookGrid = document.getElementById("bookGrid");
    const dialog = document.getElementById("bookDialog");
    const form = document.getElementById("bookForm");
    const searchInput = document.getElementById("searchInput");
    const statusFilter = document.getElementById("statusFilter");
    let books = loadBooks();
    let toastTimer;

    function loadBooks() {
      try {
        const saved = localStorage.getItem(STORAGE_KEY);
        if (saved === null) {
          return [
            { id: "sample-1", title: "불편한 편의점", author: "김호연", pages: 268, readPages: 124, status: "reading" },
            { id: "sample-2", title: "아주 작은 습관의 힘", author: "제임스 클리어", pages: 320, readPages: 0, status: "want" },
            { id: "sample-3", title: "모순", author: "양귀자", pages: 308, readPages: 308, status: "finished" }
          ];
        }
        const parsed = JSON.parse(saved);
        if (!Array.isArray(parsed)) throw new Error("저장된 책 목록 형식이 올바르지 않습니다.");
        return parsed.filter(book => book && typeof book.id === "string" && typeof book.title === "string"
          && typeof book.author === "string" && Number.isFinite(book.pages) && Number.isFinite(book.readPages)
          && ["reading", "finished", "want"].includes(book.status));
      } catch (error) {
        console.error("독서 기록을 불러오지 못했습니다.", error);
        return [];
      }
    }

    function saveBooks() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(books));
      } catch (error) {
        console.error("독서 기록을 저장하지 못했습니다.", error);
        showToast("기록을 저장하지 못했어요. 브라우저 저장 공간을 확인해 주세요.");
      }
    }

    function escapeHTML(value) {
      return String(value).replace(/[&<>"']/g, character => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
      })[character]);
    }

    function render() {
      const query = searchInput.value.trim().toLocaleLowerCase("ko");
      const selectedStatus = statusFilter.value;
      const visibleBooks = books.filter(book => {
        const matchesSearch = `${book.title} ${book.author}`.toLocaleLowerCase("ko").includes(query);
        return matchesSearch && (selectedStatus === "all" || book.status === selectedStatus);
      });

      if (visibleBooks.length === 0) {
        const isEmpty = books.length === 0;
        bookGrid.innerHTML = `<div class="empty-state"><strong>${isEmpty ? "아직 기록이 없습니다" : "검색 결과가 없습니다"}</strong><p>${isEmpty ? "새 기록을 눌러 첫 번째 책을 추가해 보세요." : "검색어나 필터를 바꿔서 다시 찾아보세요."}</p></div>`;
        return;
      }

      bookGrid.innerHTML = visibleBooks.map(book => {
        const percent = Math.min(100, Math.round((book.readPages / book.pages) * 100));
        const actionText = book.status === "finished" ? "다 읽었어요" : book.status === "want" ? "읽기 시작" : "+10쪽 읽기";
        const actionDisabled = book.status === "finished";
        const statusImage = statusImages[book.status];
        return `<article class="book-card" data-status="${book.status}">
          <div class="book-card-top">
            <div class="book-status-group">
              <span class="status-label" data-status="${book.status}">${statusLabels[book.status]}</span>
              ${statusImage ? `<img class="status-thumb" src="${statusImage}" alt="">` : ""}
            </div>
            <button class="delete-button" type="button" data-action="delete" data-id="${escapeHTML(book.id)}" aria-label="${escapeHTML(book.title)} 기록 삭제">삭제</button>
          </div>
          <h3 class="book-title" title="${escapeHTML(book.title)}">${escapeHTML(book.title)}</h3>
          <p class="book-author">${escapeHTML(book.author)}</p>
          <div class="progress-row"><span>독서 진행률</span><span class="progress-number">${book.readPages} / ${book.pages}쪽 · ${percent}%</span></div>
          <div class="progress-track" role="progressbar" aria-label="${escapeHTML(book.title)} 독서 진행률" aria-valuenow="${percent}" aria-valuemin="0" aria-valuemax="100"><div class="progress-fill" style="width:${percent}%"></div></div>
          <div class="card-actions">
            <button class="progress-button" type="button" data-action="progress" data-id="${escapeHTML(book.id)}" ${actionDisabled ? "disabled" : ""}>${actionText}</button>
          </div>
        </article>`;
      }).join("");
    }

    function showToast(message) {
      const current = document.querySelector(".toast");
      if (current) current.remove();
      clearTimeout(toastTimer);
      const toast = document.createElement("div");
      toast.className = "toast";
      toast.setAttribute("role", "status");
      toast.textContent = message;
      document.body.append(toast);
      toastTimer = setTimeout(() => toast.remove(), 2400);
    }

    document.getElementById("todayLabel").textContent = new Intl.DateTimeFormat("ko-KR", {
      year: "numeric", month: "long", day: "numeric", weekday: "short"
    }).format(new Date());

    document.getElementById("openDialogButton").addEventListener("click", () => {
      form.reset();
      document.getElementById("formError").textContent = "";
      dialog.showModal();
      document.getElementById("titleInput").focus();
    });
    document.getElementById("closeDialogButton").addEventListener("click", () => dialog.close());
    document.getElementById("cancelButton").addEventListener("click", () => dialog.close());
    dialog.addEventListener("click", event => {
      if (event.target === dialog) dialog.close();
    });
    searchInput.addEventListener("input", render);
    statusFilter.addEventListener("change", render);

    form.addEventListener("submit", event => {
      event.preventDefault();
      const data = new FormData(form);
      const title = String(data.get("title")).trim();
      const author = String(data.get("author")).trim();
      const pages = Number(data.get("pages"));
      let readPages = Number(data.get("readPages"));
      let status = String(data.get("status"));
      const error = document.getElementById("formError");
      error.textContent = "";

      if (!title || !author || !Number.isInteger(pages) || pages < 1 || !Number.isInteger(readPages) || readPages < 0 || readPages > pages) {
        error.textContent = "제목과 작가를 입력하고, 쪽수를 올바르게 확인해 주세요.";
        return;
      }
      if (!["reading", "finished", "want"].includes(status)) {
        error.textContent = "독서 상태를 선택해 주세요.";
        return;
      }
      if (status === "finished") readPages = pages;
      if (readPages === pages) status = "finished";

      books.unshift({ id: crypto.randomUUID ? crypto.randomUUID() : `${Date.now()}-${Math.random()}`, title, author, pages, readPages, status });
      saveBooks();
      render();
      dialog.close();
      showToast("책장에 새 기록을 추가했어요.");
    });

    bookGrid.addEventListener("click", event => {
      const button = event.target.closest("button[data-action]");
      if (!button) return;
      const book = books.find(item => item.id === button.dataset.id);
      if (!book) return;

      if (button.dataset.action === "delete") {
        books = books.filter(item => item.id !== book.id);
        saveBooks();
        render();
        showToast("책 기록을 삭제했어요.");
      } else if (button.dataset.action === "progress" && book.status !== "finished") {
        if (book.status === "want") book.status = "reading";
        book.readPages = Math.min(book.pages, book.readPages + 10);
        if (book.readPages === book.pages) book.status = "finished";
        saveBooks();
        render();
        showToast(book.status === "finished" ? "완독 처리되었습니다." : "독서 진도를 업데이트했어요.");
      }
    });

    render();
  </script>
</body>
</html>
